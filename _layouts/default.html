<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        body {
            background-color: #0d0221; /* Dark Purple */
            color: #0f0; /* Neon Green */
            font-family: 'Press Start 2P', cursive;
            line-height: 1.8;
            padding: 40px;
            max-width: 900px;
            margin: 0 auto;
        }
        
        h1, h2, h3 {
            color: #ff00de; /* Hot Pink */
            text-shadow: 3px 3px #000;
            text-transform: uppercase;
            border-bottom: 4px solid #0f0;
            padding-bottom: 10px;
        }
        
        .stat-box {
            border: 4px double #0f0;
            padding: 20px;
            margin-bottom: 30px;
            background: #000;
            box-shadow: 8px 8px #ff00de;
        }
        
        .skill-bar {
            background: #333;
            height: 25px;
            width: 100%;
            margin-top: 10px;
            border: 2px solid #fff;
        }
        
        .skill-fill {
            background: #0f0;
            height: 100%;
            display: block;
        }
        
        a {
            color: #0ff; /* Cyan */
            text-decoration: none;
            border: 2px solid #0ff;
            padding: 10px 15px;
            display: inline-block;
            margin-top: 10px;
            transition: all 0.2s;
        }
        
        a:hover {
            background-color: #0ff;
            color: #000;
            box-shadow: 4px 4px #ff00de;
        }
    </style>
</head>
<body>
    {{ content }}
    <!-- The Rabbit Container -->
<div id="pet-rabbit" style="
    position: fixed;
    bottom: 30px;
    right: 30px;
    width: 60px;
    height: 60px;
    pointer-events: none; /* Lets clicks pass through */
    z-index: 9999;
    transition: transform 0.1s ease-out;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
">
    <!-- Replace src with your uploaded rabbit.png OR use the emoji below -->
    <img src="assets/rabbit.png" alt="Pet Rabbit" style="width: 100%; height: 100%; object-fit: contain;">
    <!-- If using emoji, delete the img tag above and uncomment this: -->
    <!-- <span style="font-size: 50px;">🐇</span> -->
</div>

<script>
const rabbit = document.getElementById('pet-rabbit');
let mouseX = window.innerWidth / 2;
let mouseY = window.innerHeight / 2;
let rabbitX = mouseX;
let rabbitY = mouseY;

// Track mouse movement
document.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

// Smooth animation loop
function animateRabbit() {
    // Calculate distance to mouse
    const dx = mouseX - rabbitX;
    const dy = mouseY - rabbitY;
    
    // Move rabbit towards mouse with a "lag" factor (0.08 = slow & smooth)
    rabbitX += dx * 0.08;
    rabbitY += dy * 0.08;
    
    // Flip rabbit based on direction
    const flip = dx > 0 ? 'scaleX(-1)' : 'scaleX(1)';
    
    // Apply position and flip
    rabbit.style.left = `${rabbitX - 30}px`; // Offset by half width
    rabbit.style.top = `${rabbitY - 30}px`;  // Offset by half height
    rabbit.style.transform = flip;
    
    requestAnimationFrame(animateRabbit);
}

animateRabbit();
</script>
</body>
</html>
